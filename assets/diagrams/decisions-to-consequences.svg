<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="Figtree, 'Segoe UI', Arial, sans-serif">
  <title>Flow diagram: Decisions feed main-effect rules and interaction rules, which update indicators, which produce explanations.</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0f7f8c"/>
    </marker>
  </defs>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="10" y="75" width="170" height="80" rx="14" fill="#e3f2f2" stroke="#0f7f8c"/>
    <text x="95" y="112" fill="#0b2540">Decisions</text>
    <text x="95" y="134" font-size="12" font-weight="500" fill="#46596e">5 user choices</text>

    <rect x="250" y="20" width="190" height="70" rx="14" fill="#ffffff" stroke="#9fb6c6"/>
    <text x="345" y="50" fill="#0b2540">Main-effect rules</text>
    <text x="345" y="71" font-size="12" font-weight="500" fill="#46596e">IF option THEN indicator +/-</text>

    <rect x="250" y="140" width="190" height="70" rx="14" fill="#ffffff" stroke="#9fb6c6"/>
    <text x="345" y="170" fill="#0b2540">Interaction rules</text>
    <text x="345" y="191" font-size="12" font-weight="500" fill="#46596e">Only for specific pairs</text>

    <rect x="510" y="75" width="170" height="80" rx="14" fill="#e1ebf8" stroke="#2f6db5"/>
    <text x="595" y="112" fill="#0b2540">Indicators</text>
    <text x="595" y="134" font-size="12" font-weight="500" fill="#46596e">5 scores, 0 to 100</text>

    <rect x="740" y="75" width="150" height="80" rx="14" fill="#0b2540"/>
    <text x="815" y="112" fill="#ffffff">Explanations</text>
    <text x="815" y="134" font-size="12" font-weight="500" fill="#bcd0e2">Who gains, who loses</text>
  </g>
  <!-- Right-angle connectors with rounded corners (radius 10) -->
  <g stroke="#0f7f8c" stroke-width="2.2" fill="none" stroke-linejoin="round" marker-end="url(#arr)">
    <path d="M180 100 H205 Q215 100 215 90 V65 Q215 55 225 55 H250"/>
    <path d="M180 130 H205 Q215 130 215 140 V165 Q215 175 225 175 H250"/>
    <path d="M440 55 H465 Q475 55 475 65 V90 Q475 100 485 100 H510"/>
    <path d="M440 175 H465 Q475 175 475 165 V140 Q475 130 485 130 H510"/>
    <path d="M680 115 H740"/>
  </g>
</svg>
